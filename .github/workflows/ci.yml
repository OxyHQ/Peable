# Gates that run on every push and pull request.
#
# This repository had no CI workflow at all — only `deploy-aws.yml`, which runs
# after main has already moved. Nothing checked a pull request, so the first
# signal a change was broken was a rolled ECS service.
#
# The Postgres service container is what makes the database gates real: the
# schema invariants, the CHECK constraints, the row lock behind the derivation
# index reservation and the migration itself are all properties only a server
# has. `packages/backend/src/db/__tests__/schemaGates.realdb.test.ts` fails the
# build if `TEST_DATABASE_URL` is missing while `CI` is set, so a container that
# silently stopped being provisioned cannot read as a green run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # x86, deliberately: GitHub-hosted arm64 runners do not support service
    # containers at all. The deploy job builds on arm64; this one does not need
    # to, and pinning it there would cost the database entirely.
    runs-on: ubuntu-latest

    services:
      postgres:
        # Plain postgres — this schema requires NO extensions (see
        # REQUIRED_EXTENSIONS in packages/backend/src/db/migrate.ts). An image
        # carrying one nobody installs on RDS would let a migration that reached
        # for it pass here and fail in production.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: peable
          POSTGRES_PASSWORD: peable
          POSTGRES_DB: peable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Where the throwaway per-suite databases are CREATED (the `postgres`
      # maintenance database on the service container).
      TEST_DATABASE_URL: postgres://peable:peable@localhost:5432/postgres
      # `config.ts` now REFUSES to load without this, because the service
      # cannot boot without it — so importing any module that reaches the
      # config singleton needs it set, including tests that never touch the
      # database. It is deliberately NOT what the suites connect to: each one
      # gets its own throwaway database from `TEST_DATABASE_URL` above and
      # points the pool at it via `setDatabaseForTesting`.
      DATABASE_URL: postgres://peable:peable@localhost:5432/peable

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          # Read from package.json's `packageManager`, which is the single
          # authority for this repository's bun version — not repeated here.
          # The Dockerfile cannot read JSON in a `FROM` line, so its literal
          # (oven/bun:<version>-alpine) is checked against the same authority by
          # `bun run validate:lockfile` below. A mismatch between the two
          # produces `lockfile had changes, but lockfile is frozen` in one place
          # and not the other, which reads as a lockfile fault rather than a pin
          # one; before that check existed a comment was all that held them
          # together.
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Reads the tracked file listing, so it needs no build and costs seconds. It
      # answers the one question a green build cannot: Mongo returns as a hoisted
      # dependency or a workflow variable, and every other step here passes while it
      # does. The port completed in #20/#36 and the Mongo database `oxypay` was dropped on 2026-08-09.
      - name: Guard against MongoDB returning
        run: bun run validate:no-mongo

      # `--frozen-lockfile` above fails only when a range resolves to nothing, so
      # it exits 0 on the shapes that actually ship. A plain install plus a diff
      # catches most of them and MISSES the worst: bun does not rewrite a
      # workspace package's recorded `version`, so a bump with no reinstall
      # leaves bun.lock stale while `git diff --quiet` reads clean. That is the
      # state a release gets published from having never been committed.
      #
      # The script does both layers, and its own self-test proves each one can
      # fail — including a fixture for the version mode, which is what the
      # install-and-diff step this replaced could not see.
      - name: Lockfile is in sync with the manifests
        run: bun run validate:lockfile

      - name: The lockfile check can still fail
        run: bun run test:validate-lockfile

      # Both published packages are built before the typecheck, because two
      # consumers resolve them through their `dist`: the backend imports
      # `@peable.to/shared-types`' compiled output, and `@peable.to/checkout` imports
      # `@peable.to/sdk/checkout`. Without these, the typecheck fails with a TS2307
      # that says nothing about the change under review.
      - run: bun run build:shared-types

      # `@peable.to/pay` is consumed from its build output, same as
      # shared-types. Stated rather than left to `postinstall`, for the same
      # reason: a job should not depend on a side effect of installing.
      - run: bun run build:pay
      - run: bun run --filter @peable.to/sdk build

      - name: Typecheck every package
        run: bun run --filter '*' typecheck

      - name: Migrations match the schema
        # A schema edited without regenerating produces DDL that never reaches
        # any database — every local test still passes, because the test harness
        # applies the OLD migration and the queries are built from the NEW
        # schema only where the two happen to agree.
        working-directory: packages/backend
        run: |
          bunx drizzle-kit generate
          if ! git diff --quiet -- src/db/migrations; then
            echo "::error::the drizzle schema has changes with no migration — run 'bun run db:generate' and add the deploy-phase marker"
            git --no-pager status --porcelain -- src/db/migrations
            exit 1
          fi

      # Every package, not just the backend. `TEST_DATABASE_URL` is set on the
      # job, so the backend's real-database suites run here and refuse to be
      # skipped.
      - run: bun run --filter '*' test

  # ── The release candidate is the IMAGE, not the source tree ────────────────
  #
  # `test` above proves the source. It proved the source on the push whose
  # backend deploy failed at `Build and push (linux/arm64)` with `Workspace
  # dependency "@peable.to/pay" not found` — because the Dockerfile copies a
  # hand-maintained list of workspace manifests and nothing outside the deploy
  # ever built it. The frontend and checkout workflows went green in that same
  # push, so the run read as a release.
  #
  # `db/__tests__/dockerfile.test.ts` catches the manifest omission specifically.
  # This job catches the rest of the class: a dependency that resolves in a
  # hoisted dev tree and not in the production install, a source file the image
  # does not copy, an entrypoint that throws at import time. It BOOTS the
  # container against a real database and polls `/ready`, so "the image builds"
  # is not mistaken for "the image serves".
  #
  # linux/amd64, deliberately. Production is arm64 and this runner is not; a
  # QEMU cross-build here would cost minutes per run to check a property that is
  # architecture-independent (the install closure and the entrypoint). The
  # arm64-specific build stays in `deploy-aws.yml`, on its arm64 runner.
  image:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: peable
          POSTGRES_PASSWORD: peable
          POSTGRES_DB: peable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build the backend image exactly as the deploy does
        # Context = repo root, same -f, same target. A different invocation here
        # would check a build the deploy never performs.
        run: docker build -f packages/backend/Dockerfile -t peable-backend:ci .

      - name: Apply migrations with the image's own migrator
        # The image runs TypeScript under Bun, so this is the SAME entrypoint the
        # one-shot ECS migration task runs. `--phase=all` because this database
        # is a from-zero genesis, which is the one case that flag is for.
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://peable:peable@localhost:5432/peable \
            peable-backend:ci \
            bun packages/backend/src/db/migrate.ts --target-database=peable --phase=all

      - name: Boot the container and wait for readiness
        # `/ready` and not `/health`: liveness would pass for a task that is
        # listening with no database, which is the state this job exists to
        # refuse. A boot failure prints the container's own log rather than a
        # bare timeout.
        run: |
          docker run -d --name peable-ci --network host \
            -e DATABASE_URL=postgres://peable:peable@localhost:5432/peable \
            -e PORT=3001 \
            peable-backend:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3001/ready > /dev/null; then
              echo "ready after ${attempt}s"
              curl -fsS http://localhost:3001/health
              exit 0
            fi
            sleep 1
          done
          echo "::error::the backend image never became ready"
          docker logs peable-ci
          exit 1

      - name: Stop the container cleanly
        # SIGTERM, then a bounded wait: `server.ts` closes the socket server and
        # the pool on it, and a container that has to be killed is a container
        # that would be killed mid-request on every ECS rollout.
        if: always()
        run: |
          docker stop --time 15 peable-ci || true
          docker logs peable-ci || true
          docker rm -f peable-ci || true
