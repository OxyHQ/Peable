# Gates that run on every push and pull request.
#
# This repository had no CI workflow at all — only `deploy-aws.yml`, which runs
# after main has already moved. Nothing checked a pull request, so the first
# signal a change was broken was a rolled ECS service.
#
# The Postgres service container is what makes the database gates real: the
# schema invariants, the CHECK constraints, the row lock behind the derivation
# index reservation and the migration itself are all properties only a server
# has. `packages/backend/src/db/__tests__/schemaGates.realdb.test.ts` fails the
# build if `TEST_DATABASE_URL` is missing while `CI` is set, so a container that
# silently stopped being provisioned cannot read as a green run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # `bump-base-digests.yml` opens its pull request with GITHUB_TOKEN, which
  # starts no `pull_request` run, so it dispatches this workflow on the bump
  # branch instead. Both jobs run on a dispatch: neither has an event `if:`.
  workflow_dispatch:

# A new push to a pull request supersedes the run still testing the old head,
# so that run is cancelled. Nothing else is ever cancelled or queued: a push to
# main gets a group of its own through the run id, since a shared group would
# still let a newer pending run replace an older pending one even with
# cancel-in-progress off.
# deploy-aws.yml's gate reads this workflow's run for the pushed commit, so a
# main run must never be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # x86, deliberately: GitHub-hosted arm64 runners do not support service
    # containers at all. The deploy job builds on arm64; this one does not need
    # to, and pinning it there would cost the database entirely.
    runs-on: ubuntu-latest

    services:
      postgres:
        # Plain postgres — this schema requires NO extensions (see
        # REQUIRED_EXTENSIONS in packages/backend/src/db/migrate.ts). An image
        # carrying one nobody installs on RDS would let a migration that reached
        # for it pass here and fail in production.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: peable
          POSTGRES_PASSWORD: peable
          POSTGRES_DB: peable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Where the throwaway per-suite databases are CREATED (the `postgres`
      # maintenance database on the service container).
      TEST_DATABASE_URL: postgres://peable:peable@localhost:5432/postgres
      # `config.ts` now REFUSES to load without this, because the service
      # cannot boot without it — so importing any module that reaches the
      # config singleton needs it set, including tests that never touch the
      # database. It is deliberately NOT what the suites connect to: each one
      # gets its own throwaway database from `TEST_DATABASE_URL` above and
      # points the pool at it via `setDatabaseForTesting`.
      DATABASE_URL: postgres://peable:peable@localhost:5432/peable

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # The production image's build inputs (Dockerfile, context, target and
      # both .dockerignore files) must match the reviewed pin in
      # .github/scripts/reviewed-images.json. The deploy refuses to build on a
      # mismatch, so catching it here is what stops a merge from stranding main
      # undeployable. In this job because branch protection requires `test`.
      # The fixture tests run first so a green check means the gate can fail.
      - name: Prove the reviewed-image gate can fail
        run: python3 -B -m unittest discover -s .github/scripts -p test_reviewed_image.py
      - name: Verify the production image's build inputs are reviewed
        run: python3 -B .github/scripts/reviewed-image.py check
      - name: Prove the base-image digest bump works
        run: python3 -B -m unittest discover -s .github/scripts -p test_bump_base_digests.py

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          # Read from package.json's `packageManager`, which is the single
          # authority for this repository's bun version — not repeated here.
          # The Dockerfile cannot read JSON in a `FROM` line, so its literal
          # (oven/bun:<version>-alpine) is checked against the same authority by
          # `bun run validate:lockfile` below. A mismatch between the two
          # produces `lockfile had changes, but lockfile is frozen` in one place
          # and not the other, which reads as a lockfile fault rather than a pin
          # one; before that check existed a comment was all that held them
          # together.
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Biome formats and lints every package (root `biome.json`). `biome ci`
      # fails on formatting drift as well as lint errors, and needs no build.
      # `--error-on-warnings` because the recommended preset reports many rules
      # (noNonNullAssertion, noExplicitAny, the unused-code rules) as warnings,
      # which alone would pass while the count crept back up from zero.
      - name: Biome (format + lint)
        run: bunx biome ci --error-on-warnings .

      # The frontend keeps a minimal ESLint config for the Expo rules Biome has
      # no equivalent for (`EXPO_PUBLIC_*` reads Metro would silently fail to
      # inline). See packages/frontend/eslint.config.js.
      - name: Expo ESLint (env-var inlining rules)
        run: bun run --filter @peable.to/frontend lint

      # `--frozen-lockfile` above fails only when a range resolves to nothing, so
      # it exits 0 on the shapes that actually ship. A plain install plus a diff
      # catches most of them and MISSES the worst: bun does not rewrite a
      # workspace package's recorded `version`, so a bump with no reinstall
      # leaves bun.lock stale while `git diff --quiet` reads clean. That is the
      # state a release gets published from having never been committed.
      #
      # The script does both layers, and its own self-test proves each one can
      # fail — including a fixture for the version mode, which is what the
      # install-and-diff step this replaced could not see.
      - name: Lockfile is in sync with the manifests
        run: bun run validate:lockfile

      - name: The lockfile check can still fail
        run: bun run test:validate-lockfile

      # Both published packages are built before the typecheck, because two
      # consumers resolve them through their `dist`: the backend imports
      # `@peable.to/shared-types`' compiled output, and `@peable.to/checkout` imports
      # `@peable.to/sdk/checkout`. Without these, the typecheck fails with a TS2307
      # that says nothing about the change under review.
      - run: bun run check:contribution-contracts
      - run: bun run build:contracts
      - run: bun run build:shared-types

      # `@peable.to/pay` is consumed from its build output, same as
      # shared-types. Stated rather than left to `postinstall`, for the same
      # reason: a job should not depend on a side effect of installing.
      - run: bun run build:pay
      - run: bun run --filter @peable.to/sdk build

      - name: Typecheck every package
        run: bun run --filter '*' typecheck

      - name: Migrations match the schema
        # A schema edited without regenerating produces DDL that never reaches
        # any database — every local test still passes, because the test harness
        # applies the OLD migration and the queries are built from the NEW
        # schema only where the two happen to agree.
        working-directory: packages/backend
        run: |
          bunx drizzle-kit generate
          if ! git diff --quiet -- src/db/migrations; then
            echo "::error::the drizzle schema has changes with no migration — run 'bun run db:generate' and add the deploy-phase marker"
            git --no-pager status --porcelain -- src/db/migrations
            exit 1
          fi

      # Every package, not just the backend. `TEST_DATABASE_URL` is set on the
      # job, so the backend's real-database suites run here and refuse to be
      # skipped.
      - run: bun run --filter '*' test

  # ── The release candidate is the IMAGE, not the source tree ────────────────
  #
  # `test` above proves the source. It proved the source on the push whose
  # backend deploy failed at `Build and push (linux/arm64)` with `Workspace
  # dependency "@peable.to/pay" not found` — because the Dockerfile copies a
  # hand-maintained list of workspace manifests and nothing outside the deploy
  # ever built it. The frontend and checkout workflows went green in that same
  # push, so the run read as a release.
  #
  # `db/__tests__/dockerfile.test.ts` catches the manifest omission specifically.
  # This job catches the rest of the class: a dependency that resolves in a
  # hoisted dev tree and not in the production install, a source file the image
  # does not copy, an entrypoint that throws at import time. It BOOTS the
  # container against a real database and polls `/ready`, so "the image builds"
  # is not mistaken for "the image serves".
  #
  # It builds what the deploy builds: the Dockerfile, context and target come
  # from `reviewed-image.py guard` (so an unreviewed input fails here exactly as
  # it would in the deploy), for linux/arm64 on the deploy's own arm64 runner
  # type, natively. It reads the deploy's layer cache and never writes it, and
  # it never pushes: the image is loaded into this runner's daemon only.
  #
  # GitHub-hosted arm64 runners do not support `services:` containers, so the
  # database is started with `docker run` instead.
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE: peable-backend:ci
      DATABASE_URL: postgres://peable:peable@localhost:5432/peable

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Refuse unreviewed image build inputs
        id: reviewed
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe peable

      - name: Start Postgres
        # Plain postgres, as in `test`: the schema requires no extensions.
        run: |
          docker run -d --name peable-pg -p 5432:5432 \
            -e POSTGRES_USER=peable -e POSTGRES_PASSWORD=peable -e POSTGRES_DB=peable \
            postgres:17-alpine

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the backend image exactly as the deploy does (linux/arm64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.reviewed.outputs.context }}
          file: ${{ steps.reviewed.outputs.dockerfile }}
          target: ${{ steps.reviewed.outputs.target }}
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          # Read-only: the deploy's scope, never `cache-to`, so pull-request
          # code cannot put layers into the cache production builds from.
          cache-from: type=gha,scope=peable-backend
          tags: ${{ env.IMAGE }}
          labels: |
            io.oxy.source.tree=${{ steps.reviewed.outputs.source_tree }}
            io.oxy.build-inputs.sha256=${{ steps.reviewed.outputs.build_inputs_sha256 }}

      - name: The runtime image carries only the backend's production closure
        # Expo, React Native and TypeScript are what a workspace-wide production
        # install used to ship; drizzle-kit and biome are dev tooling; the other
        # workspaces' manifests and sources have no business in the image.
        # Searched at any depth, not just the top of node_modules.
        env:
          PINNED: ${{ steps.reviewed.outputs.build_inputs_sha256 }}
        run: |
          set -euo pipefail
          docker image inspect "$IMAGE" --format '{{ index .Config.Labels "io.oxy.build-inputs.sha256" }}' | grep -qx "$PINNED"
          docker run --rm --entrypoint sh "$IMAGE" -euc '
            found=$(find /app -type d \( -path "*/node_modules/expo" -o -path "*/node_modules/react-native" \
              -o -path "*/node_modules/typescript" -o -path "*/node_modules/electron" -o -path "*/node_modules/react" \
              -o -path "*/node_modules/drizzle-kit" -o -path "*/node_modules/@biomejs" -o -path "*/node_modules/@expo" \) -print)
            if [ -n "$found" ]; then echo "::error::the runtime image ships packages the backend does not load:"; echo "$found"; exit 1; fi
            for p in frontend checkout sdk pay; do
              if [ -e "/app/packages/$p" ]; then echo "::error::packages/$p is in the runtime image"; exit 1; fi
            done
            for f in /app/bun.lock /app/bunfig.toml /app/package.json; do
              if [ -e "$f" ]; then echo "::error::$f is in the runtime image"; exit 1; fi
            done
            test -f /app/node_modules/express/package.json
            test -f /app/node_modules/@peable.to/shared-types/dist/esm/index.js
            echo "node_modules: $(du -sh /app/node_modules | cut -f1), $(ls /app/node_modules | wc -l) top-level entries"
          '
          size=$(docker image inspect "$IMAGE" --format '{{ .Size }}')
          echo "image size (uncompressed): $(( size / 1024 / 1024 )) MiB"
          echo "Runtime image: $(( size / 1024 / 1024 )) MiB uncompressed (linux/arm64)" >> "$GITHUB_STEP_SUMMARY"

      - name: The app user cannot write the app
        # Every file is copied without --chown, so root owns it and uid 1001 can
        # only read it.
        run: |
          set -euo pipefail
          test "$(docker image inspect "$IMAGE" --format '{{ .Config.User }}')" = appuser
          docker run --rm --entrypoint sh "$IMAGE" -euc '
            test "$(id -u)" = 1001
            notroot=$(find /app ! -user root -print | head -5)
            if [ -n "$notroot" ]; then echo "::error::files in /app not owned by root:"; echo "$notroot"; exit 1; fi
            for f in /app /app/packages/backend/src/server.ts /app/node_modules/express/package.json /app/node_modules; do
              if [ -w "$f" ]; then echo "::error::$f is writable by the app user"; exit 1; fi
            done
            if touch /app/packages/backend/src/server.ts 2>/dev/null; then echo "::error::the app user wrote server.ts"; exit 1; fi
          '

      - name: Wait for Postgres
        run: |
          for attempt in $(seq 1 30); do
            if docker exec peable-pg pg_isready -U peable >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs peable-pg
          exit 1

      - name: Apply migrations with the image's own migrator
        # The image runs TypeScript under Bun, so this is the SAME entrypoint the
        # one-shot ECS migration task runs. `--phase=all` because this database
        # is a from-zero genesis, which is the one case that flag is for.
        run: |
          docker run --rm --network host -e DATABASE_URL "$IMAGE" \
            bun packages/backend/src/db/migrate.ts --target-database=peable --phase=all

      - name: Boot the container and wait for readiness
        # `/ready` and not `/health`: liveness would pass for a task that is
        # listening with no database, which is the state this job exists to
        # refuse. A boot failure prints the container's own log rather than a
        # bare timeout.
        run: |
          docker run -d --name peable-ci --network host -e DATABASE_URL -e PORT=3001 "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3001/ready > /dev/null; then
              echo "ready after ${attempt}s"
              curl -fsS http://localhost:3001/health
              exit 0
            fi
            sleep 1
          done
          echo "::error::the backend image never became ready"
          docker logs peable-ci
          exit 1

      - name: Stop the container cleanly
        # SIGTERM, then a bounded wait: `server.ts` closes the socket server and
        # the pool on it, and a container that has to be killed is a container
        # that would be killed mid-request on every ECS rollout.
        if: always()
        run: |
          docker stop --time 15 peable-ci || true
          docker logs peable-ci || true
          docker rm -f peable-ci peable-pg || true
