# Deploy the wallet's web export (@peable.to/frontend) to Cloudflare Pages.
#
# This serves the APEX, peable.to — which is what makes `peable.to/@username`
# work at all, since that profile page is a route of this app. It follows the
# shape every other Oxy product apex uses: homiio.com -> homiio-frontend.pages.dev
# and clarity.surf -> clarity-7nu.pages.dev are the same arrangement, proxied,
# with api.* left DNS-only to the ALB.
#
# Separate from deploy-checkout.yml on purpose. They are two different apps in
# two different Pages projects on two different hostnames, and one's build
# breaking must not withhold the other's release.
name: Deploy frontend to Cloudflare Pages

on:
  # After CI passes on a push to main, never alongside it. Until 2026-10 this
  # ran on `push`, in parallel with CI, so a commit whose CI went red still
  # shipped. `workflow_run` takes no `paths:`; the `scope` job below puts back
  # the path filter, measured from the last commit this workflow released.
  # Gated on CI, not on the backend's rollout: exactly as unordered relative to
  # deploy-aws.yml as it was on `push`.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Releases main's head, and only once CI succeeded on a push for it.
  workflow_dispatch:

# Checkout and Pages need nothing more: wrangler authenticates with the
# Cloudflare credentials below, never with the job token. `scope` adds
# `actions: read` for itself.
permissions:
  contents: read

env:
  # The commit under release: the one CI tested on `workflow_run`, main's head
  # on a dispatch. Never `github.sha` alone, which on `workflow_run` is
  # whatever main points at when CI finished.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Whether this run releases anything, decided OUTSIDE the release lane on
  # a few seconds of ubuntu-latest. The trigger guards, the ordering rule and
  # the marker-based path scope are deploy-scope.sh's, exactly as in
  # deploy-aws.yml. A dispatch skips the path scope but still requires CI to
  # have succeeded on a push for main's head.
  scope:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      frontend: ${{ steps.frontend.outputs.frontend }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Release only a CI-green main commit nothing newer carries
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/deploy-scope.sh gate
      # The wallet bundles shared-types, `@peable.to/pay`, `@peable.to/contracts`
      # and `@peable.to/sdk/contributions` (all built below) and resolves through
      # the root manifests. `pay` was missing from the old `push.paths` list.
      - name: Decide whether anything the wallet's web export builds from changed
        id: frontend
        if: steps.gate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash .github/scripts/deploy-scope.sh target frontend include
          '^(packages/frontend/|packages/shared-types/|packages/pay/|packages/contracts/|packages/sdk/|package\.json$|bun\.lock$|bunfig\.toml$|\.github/workflows/deploy-frontend\.yml$)'
          peable-release-frontend-

  deploy:
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # Measured 1-4 minutes of work; a backstop against the 6-hour default.
    timeout-minutes: 30
    # One Pages upload at a time, never cancelled mid-upload. On the job, not
    # the workflow, so only a run `scope` admitted ever enters the lane and a
    # late older commit cannot displace a newer pending release.
    concurrency:
      group: deploy-peable-frontend
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      # Expo SDK 58's CLI (expo lint / expo export run under Node through the
      # `expo` bin's shebang) supports Node 22.13+ / 24.3+ only, so pin a
      # supported major instead of trusting the runner image's default Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - run: bun install --frozen-lockfile

      # shared-types is consumed through its compiled output. Root `postinstall`
      # already builds it, but stating it here means this job does not depend on
      # a side effect of installing — the same reason `ci.yml` repeats it.
      - run: bun run build:shared-types

      # `@peable.to/pay` is consumed from its build output, same as
      # shared-types. Stated rather than left to `postinstall`, for the same
      # reason: a job should not depend on a side effect of installing.
      - run: bun run build:pay

      # `@peable.to/sdk/contributions` (the wallet's contribution screen) is
      # consumed from its `dist`, which nothing else builds: without it Metro
      # fails to resolve the package's `exports`. contracts first, since the
      # SDK compiles against its output.
      - run: bun run build:contracts
      - run: bun run --filter @peable.to/sdk build

      - run: bun run build:frontend
        env:
          # Every one of these has a correct production default in
          # `src/config.ts`, and they are injected anyway. A default that
          # happens to be right in production is indistinguishable from a
          # variable that silently stopped being injected: nothing is empty and
          # nothing errors, the bundle just quietly points somewhere else. The
          # website's deploy carries the same note about its Oxy client id.
          EXPO_PUBLIC_OXY_BASE_URL: https://api.oxy.so
          EXPO_PUBLIC_GATEWAY_API_URL: https://api.peable.to
          EXPO_PUBLIC_GATEWAY_SOCKET_URL: wss://api.peable.to
          # Must stay EXACTLY equal to a redirect URI registered on the Oxy
          # OAuth client, or sign-in fails at the redirect with no clue on this
          # side of the exchange.
          EXPO_PUBLIC_OXY_AUTH_REDIRECT_URI: https://peable.to

      # `bunx wrangler@4` DIRECTLY, never `cloudflare/wrangler-action` — the
      # action is forbidden fleet-wide (~/Oxy/docs/infra-and-deploys.md). It
      # installs its own wrangler into the working tree mid-deploy, and that
      # install is what failed run 35019486292 (2026-09-15), publishing nothing:
      #
      #   [command] /home/runner/.bun/bin/bun i wrangler@3.90.0
      #   error: Fail extracting tarball for "wrangler"
      #
      # Same error that cost Homiio a production outage and failed Clarity's
      # deploy. Pinned to a major so a new wrangler major cannot change the
      # deploy path with no diff to show for it. Credentials come from the
      # environment, which is where wrangler reads them.
      - name: Deploy to Cloudflare Pages
        run: bunx wrangler@4 pages deploy packages/frontend/dist --project-name=peable-frontend --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The scope job's base for the next release (see deploy-aws.yml). Only a
      # successful deploy on main reaches this; lost or evicted, the next run
      # releases.
      - name: Write the release marker
        run: printf '%s\n' "$RELEASE_SHA" >"$RUNNER_TEMP/release-marker"
      - name: Record this release for the next scope decision
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-marker
          key: peable-release-frontend-${{ env.RELEASE_SHA }}
