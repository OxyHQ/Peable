# Deploy the Peable Gateway backend (@peable.to/backend) to AWS ECS Fargate.
#
# Adapted from the canonical Mention backend workflow. Builds a native arm64
# image on an arm64 runner, pushes it to ECR, and rolls the ECS service. The
# ECR repo (oxy/peable) and the ECS service (peable on cluster oxy-cluster,
# port 3001) are provisioned in terraform (~/Oxy/oxy-infra). Promotion requires
# an existing steady service and a provable pinned rollback image.
name: Deploy to AWS

on:
  # After CI passes on a push to main, never alongside it. CI includes the
  # container build and boot (`ci.yml`'s `image` job, which a push to main
  # always runs), so nothing is promoted over a red build. Until 2026-10 this
  # ran on `push` and a `gate` job held a runner for up to 30 minutes polling
  # CI's run for the pushed commit; `workflow_run` starts it only once CI has
  # an answer, and the `scope` job below puts back the path filter `push` gave.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Releases main's head on demand, and still only once CI succeeded on a push
  # for it (`deploy-scope.sh gate` checks that, once, and refuses otherwise).
  workflow_dispatch:
    inputs:
      sync_secrets:
        description: 'Opt in only after reviewing GitHub secret changes. Readiness promotion preserves SSM.'
        required: false
        default: false
        type: boolean
      migration_phase:
        description: 'Migration run. Leave as pre-post for a normal release; `all` is the from-zero genesis / cutover only.'
        required: false
        default: pre-post
        type: choice
        options: [pre-post, all]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: peable
  CLUSTER: oxy-cluster
  TASK_FAMILY: oxy-peable
  MIGRATION_WAIT_TIMEOUT_SECONDS: 660
  RELEASE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  # The commit under release: the one CI tested on `workflow_run`, main's head
  # on a dispatch. Never `github.sha` alone, which on `workflow_run` is whatever
  # main points at when CI finished.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  # The database the migrator is allowed to write DDL to. Checked against
  # `current_database()` by `--target-database`, so a task whose DATABASE_URL
  # reaches somewhere else fails instead of migrating it — a migrator pointed at
  # the wrong database does not error, it finds an empty ledger, applies the
  # whole journal and reports success over a database nobody meant to touch.
  # The product rename keeps the existing production database so merchant and
  # payment history survives the cutover. The database name is an internal
  # identifier; changing it is neither required nor safe during a rolling
  # service rename.
  PG_DATABASE: oxypay

jobs:
  # ── Nothing is promoted over a red build, and only what changed ships ─────
  #
  # Decides, OUTSIDE the release lane, whether `deploy` runs at all, on a
  # ubuntu-latest runner for a few seconds, so a run with nothing to release
  # never holds the arm64 one. See deploy-scope.sh for each rule:
  #
  #  * the trigger guards: CI succeeded, on a push, to main, in this repository
  #    (`workflow_run` also fires for red runs and for a fork's `main`);
  #  * order: an older commit whose CI finished late is held only while a newer
  #    main commit has a CI run of its own that is live or green, and released
  #    otherwise (a bot push starts no CI, and must not strand it);
  #  * path scope: what the old `push.paths` decided, measured from the last
  #    commit this workflow RELEASED (a marker the deploy job writes) rather
  #    than from one push, so a skipped commit's changes are never lost. The
  #    backend image bundles shared-types, the SDK and the root manifests, and
  #    `.dockerignore` and the reviewed pin (under `.github/scripts/`) are build
  #    inputs too, so a change to any of them deploys. When unsure, release.
  #
  # A dispatch skips the path scope (it is the manual redeploy) but not the
  # one-shot check that CI succeeded on a push for main's head.
  scope:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job level: no OIDC token here, and `actions: read` (CI's runs, the release
    # marker) reaches no other job.
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.backend.outputs.backend }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Release only a CI-green main commit nothing newer carries
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/deploy-scope.sh gate
      - name: Decide whether anything the backend image ships changed
        id: backend
        if: steps.gate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash .github/scripts/deploy-scope.sh target backend include
          '^(packages/backend/|packages/shared-types/|packages/sdk/|\.github/scripts/|\.dockerignore$|package\.json$|bun\.lock$|bunfig\.toml$|\.github/workflows/deploy-aws\.yml$)'
          peable-release-backend-

  deploy:
    needs: scope
    # `scope` admits only a CI-green main commit with something to release. The
    # ref check stays as well: only the protected main branch may assume the
    # AWS deploy role (on `workflow_run` the ref is the default branch).
    if: github.ref == 'refs/heads/main' && needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    # The worst chain is bounded by the scripts' own deadlines: the build, the
    # pre migration (MIGRATION_WAIT_TIMEOUT_SECONDS, 11 min), the rollout and a
    # rollback to the previous revision (ROLLOUT_TIMEOUT_SECONDS, 20 min each)
    # or the post migration after a good rollout (11 min). About 55 min plus
    # the build; 90 keeps every one of those inside the job, so it is never
    # killed mid-rollout, while a hang no longer holds the slot for 6 hours.
    timeout-minutes: 90
    # Deploys run one at a time and are never cancelled: a rollout interrupted
    # half-way is worse than a late one. A newer pending run may replace an
    # older pending one, which is safe because its `scope` diffed from the last
    # RELEASED commit and so carries the older one. On the JOB, not the
    # workflow, so only a run `scope` admitted ever enters the lane: a red CI
    # run or a late older commit cannot displace a pending release.
    concurrency:
      group: deploy-peable-aws
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # The secrets are enumerated one at a time, on purpose.
      #
      # The allowlist below already existed, but the VALUES still came from
      # `toJSON(secrets)`, and it is that expression which holds deploys: a
      # workflow that walks every repository secret into a shell loop is shaped
      # exactly like an exfiltration payload, so GitHub creates the run with
      # conclusion `action_required` and ZERO jobs until a human clicks
      # "Approve and run" in the UI. The REST approve endpoint only serves fork
      # pull requests, so it cannot be automated, and the approval is per run —
      # every deploy needs a person. Filtering the blob after the fact does not
      # help; the blob must never be built.
      #
      # The list is the secrets the `peable` task definition actually consumes.
      # Adding a new one means adding it here, or it never reaches SSM.
      - name: Sync GitHub secrets -> SSM (GitHub is the source of truth)
        if: github.event_name == 'workflow_dispatch' && inputs.sync_secrets == true
        env:
          # The Postgres connection string, and the one the service cannot boot
          # without: `config.ts` refuses to load without it and `server.ts`
          # opens the pool before listening. An unset or placeholder GitHub
          # secret is SKIPPED by sync_secret below, so this can never overwrite
          # a value provisioned directly in SSM.
          APP_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Read by @oxy.so/core (request hashing).
          APP_IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
          APP_DEVICE_ID_SALT: ${{ secrets.DEVICE_ID_SALT }}
          # The card rail (ADR 0001). Absent from this list until now, which is
          # why it has never been reachable in production: `resolveStripeEnabled`
          # is a conjunction, so with none of these set it returns false at the
          # FIRST check and does not even emit its "incomplete configuration"
          # warning. The rail is simply off, `resolveProvider` answers "not
          # configured", and `/v1/refunds` returns 503 — a silence by design that
          # reads exactly like a rail nobody switched on.
          #
          # The two _PREVIOUS names are the rotation window. A gateway cannot
          # atomically swap a webhook secret, so a rotation is: set the outgoing
          # one as _PREVIOUS, switch, clear. Left unset they are skipped by
          # sync_secret, which is the correct steady state.
          APP_STRIPE_ENABLED: ${{ secrets.STRIPE_ENABLED }}
          APP_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          # Public by construction, and carried here anyway: it belongs beside
          # the secret key because the two have to describe the SAME mode, and
          # splitting them across two provisioning mechanisms is how a live
          # deployment ends up serving a test publishable key to a card form.
          APP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          APP_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          APP_STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}
          APP_STRIPE_WEBHOOK_SECRET_PREVIOUS: ${{ secrets.STRIPE_WEBHOOK_SECRET_PREVIOUS }}
          APP_STRIPE_CONNECT_WEBHOOK_SECRET_PREVIOUS: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET_PREVIOUS }}
          # Oxy's file events (ADR 0043 D9): the signing secret Oxy shows ONCE
          # when Peable's endpoint is set, and the rotation window beside it.
          # Unset, `/v1/webhooks/oxy/files` still answers the verification
          # challenge and refuses events with a 503, which Oxy retries.
          APP_OXY_FILES_WEBHOOK_SECRET: ${{ secrets.OXY_FILES_WEBHOOK_SECRET }}
          APP_OXY_FILES_WEBHOOK_SECRET_PREVIOUS: ${{ secrets.OXY_FILES_WEBHOOK_SECRET_PREVIOUS }}
        run: |
          sync_secret() {
            name="$1"; value="$2"; path="$3"
            if [ -z "$value" ] || [ "$value" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $name; SSM unchanged"
              return 0
            fi
            aws ssm put-parameter --name "$path" --value "$value" --type SecureString --overwrite >/dev/null
            echo "synced -> $path"
          }

          sync_secret DATABASE_URL "$APP_DATABASE_URL" "/oxy/$APP/DATABASE_URL"
          sync_secret IP_HASH_SALT "$APP_IP_HASH_SALT" "/oxy/$APP/IP_HASH_SALT"
          sync_secret DEVICE_ID_SALT "$APP_DEVICE_ID_SALT" "/oxy/$APP/DEVICE_ID_SALT"
          sync_secret STRIPE_ENABLED "$APP_STRIPE_ENABLED" "/oxy/$APP/STRIPE_ENABLED"
          sync_secret STRIPE_SECRET_KEY "$APP_STRIPE_SECRET_KEY" "/oxy/$APP/STRIPE_SECRET_KEY"
          sync_secret STRIPE_PUBLISHABLE_KEY "$APP_STRIPE_PUBLISHABLE_KEY" "/oxy/$APP/STRIPE_PUBLISHABLE_KEY"
          sync_secret STRIPE_WEBHOOK_SECRET "$APP_STRIPE_WEBHOOK_SECRET" "/oxy/$APP/STRIPE_WEBHOOK_SECRET"
          sync_secret STRIPE_CONNECT_WEBHOOK_SECRET "$APP_STRIPE_CONNECT_WEBHOOK_SECRET" "/oxy/$APP/STRIPE_CONNECT_WEBHOOK_SECRET"
          sync_secret STRIPE_WEBHOOK_SECRET_PREVIOUS "$APP_STRIPE_WEBHOOK_SECRET_PREVIOUS" "/oxy/$APP/STRIPE_WEBHOOK_SECRET_PREVIOUS"
          sync_secret STRIPE_CONNECT_WEBHOOK_SECRET_PREVIOUS "$APP_STRIPE_CONNECT_WEBHOOK_SECRET_PREVIOUS" "/oxy/$APP/STRIPE_CONNECT_WEBHOOK_SECRET_PREVIOUS"
          sync_secret OXY_FILES_WEBHOOK_SECRET "$APP_OXY_FILES_WEBHOOK_SECRET" "/oxy/$APP/OXY_FILES_WEBHOOK_SECRET"
          sync_secret OXY_FILES_WEBHOOK_SECRET_PREVIOUS "$APP_OXY_FILES_WEBHOOK_SECRET_PREVIOUS" "/oxy/$APP/OXY_FILES_WEBHOOK_SECRET_PREVIOUS"

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # `--cache-from/--cache-to type=gha` below need the Actions runtime token
      # and cache URL, which GitHub gives to JavaScript actions and NOT to `run:`
      # steps; without them buildx skips the cache silently. Only a push to main
      # (via CI's `workflow_run`) or a dispatch of main runs this job, so
      # pull-request code never writes this cache scope.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4

      # Production builds only what the owner reviewed. The Dockerfile, its
      # context, target and both .dockerignore files are hashed and compared
      # with the ONE pin in .github/scripts/reviewed-images.json; a mismatch
      # stops here, before anything is built or pushed. The Dockerfile path,
      # context and the label values below are this step's outputs, so the
      # build cannot use a different file than the one checked, and no hash is
      # spelled out in this workflow to drift from the pin. CI runs the same
      # check on every pull request (`reviewed-image.py check`, in the required
      # `test` job), so a change that would stop here fails before it can merge.
      - name: Refuse unreviewed image build inputs
        id: reviewed
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe peable

      # --provenance=false keeps the pushed artefact a single-platform image
      # manifest rather than an index with an attestation.
      - name: Build and push (linux/arm64)
        id: image
        env:
          DOCKERFILE: ${{ steps.reviewed.outputs.dockerfile }}
          CONTEXT: ${{ steps.reviewed.outputs.context }}
          SOURCE_TREE: ${{ steps.reviewed.outputs.source_tree }}
          BUILD_INPUTS_SHA256: ${{ steps.reviewed.outputs.build_inputs_sha256 }}
        run: |
          set -euo pipefail
          IMG=$ECR_REGISTRY/oxy/$APP
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=$APP-backend \
            --cache-to type=gha,scope=$APP-backend,mode=max \
            --provenance=false \
            -f "$DOCKERFILE" \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "io.oxy.source.tree=$SOURCE_TREE" \
            --label "io.oxy.build-inputs.sha256=$BUILD_INPUTS_SHA256" \
            -t "$IMG:$RELEASE_SHA" \
            --metadata-file image-metadata.json \
            --push \
            "$CONTEXT"
          DIGEST=$(jq -er '."containerimage.digest"' image-metadata.json)
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=$IMG@$DIGEST" >> "$GITHUB_OUTPUT"

      # ── Migrations run as one-shot ECS tasks, around the rollout ─────────────
      #
      # Two phases, and the split is the whole point (see @oxy.so/db's phases.ts):
      # `pre` is additive and safe while the OLD image still serves, so it runs
      # BEFORE the service update; `post` drops and narrows, which would break
      # the old image, so it runs AFTER the new one is live. Every migration file
      # declares its own side and the migrator refuses to guess for one that does
      # not.
      #
      # Preserve the deployed configuration and pin both candidate and rollback.
      # No :latest tag is updated and mixed running revisions/digests fail closed.
      - name: Resolve the ECS one-shot shape
        id: ecs
        env:
          REQUESTED_PHASE: ${{ github.event.inputs.migration_phase }}
          CANDIDATE_IMAGE: ${{ steps.image.outputs.image }}
          RELEASE_RECEIPT_DIR: ${{ runner.temp }}/peable-release
        run: |
          set -euo pipefail
          echo "phase_mode=${REQUESTED_PHASE:-pre-post}" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/ecs-release.py prepare

      # Does this release contain a post-rollout migration at all? Grepped with
      # the pattern @oxy.so/db EXPORTS (`POST_PHASE_GREP_PATTERN`), never a copy —
      # `src/db/__tests__/deployWorkflow.test.ts` asserts this workflow contains
      # that exact string, so the two cannot drift. The grep is sound only
      # because the migrator separately proves every file carries exactly one
      # well-formed marker; without that a typo would read as "no post migration"
      # and the drop would never be applied by anything.
      - name: Detect a post-rollout migration in this release
        id: phases
        run: |
          if grep -rlE '^-- oxy:deploy-phase=post$' packages/backend/src/db/migrations >/dev/null 2>&1; then
            echo "has_post=true" >> "$GITHUB_OUTPUT"
            echo "this release carries at least one post-rollout migration"
          else
            echo "has_post=false" >> "$GITHUB_OUTPUT"
            echo "no post-rollout migration in this release"
          fi

      # The CUTOVER path, chosen by hand from workflow_dispatch. One `all` run
      # applies the whole chain in journal order before the rollout, which the
      # pre/post pair cannot do: a `pre` migration queued behind an unapplied
      # `post` one BLOCKS by design. It is safe only on a database no image is
      # serving yet — which is also why it must never be the default. This is the
      # path the from-zero genesis takes.
      - name: Migrate (all) — cutover only, never a normal release
        if: steps.ecs.outputs.status == 'ACTIVE' && steps.ecs.outputs.phase_mode == 'all'
        run: .github/scripts/run-migration-task.sh all
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
          CONTAINER_NAME: ${{ steps.ecs.outputs.container }}
          EXPECTED_IMAGE: ${{ steps.image.outputs.image }}
          NETWORK_CONFIGURATION: ${{ steps.ecs.outputs.network }}

      - name: Migrate (pre) — before the rollout
        if: steps.ecs.outputs.status == 'ACTIVE' && steps.ecs.outputs.phase_mode != 'all'
        run: .github/scripts/run-migration-task.sh pre
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
          CONTAINER_NAME: ${{ steps.ecs.outputs.container }}
          EXPECTED_IMAGE: ${{ steps.image.outputs.image }}
          NETWORK_CONFIGURATION: ${{ steps.ecs.outputs.network }}

      - name: Deploy to ECS (pinned rollout with verified rollback)
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
          ROLLBACK_TASK_DEFINITION: ${{ steps.ecs.outputs.rollback_task_definition }}
          CANDIDATE_IMAGE: ${{ steps.image.outputs.image }}
          PREVIOUS_IMAGE: ${{ steps.ecs.outputs.previous_image }}
          RELEASE_RECEIPT_DIR: ${{ runner.temp }}/peable-release
        run: python3 .github/scripts/ecs-release.py rollout

      # Only when the release actually has one. Skipping the task entirely is not
      # an optimisation — a `post` run against a database with a pending `pre`
      # migration BLOCKS by design, so running it every time would turn a normal
      # release into a red deploy.
      # Skipped entirely on the cutover path: the `all` run above already applied
      # these, so a `post` here would find nothing — and running it would only
      # add a way for a green cutover to end on a red step.
      #
      # At desiredCount=0 the helper repoints the pinned revision, records that
      # no runtime was verified, and keeps post reachable. A mutable previous
      # image at zero capacity is refused because its rollback cannot be proven.
      - name: Migrate (post) — after the new image is live
        if: >-
          steps.ecs.outputs.status == 'ACTIVE'
          && steps.ecs.outputs.phase_mode != 'all'
          && steps.phases.outputs.has_post == 'true'
        run: .github/scripts/run-migration-task.sh post
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
          CONTAINER_NAME: ${{ steps.ecs.outputs.container }}
          EXPECTED_IMAGE: ${{ steps.image.outputs.image }}
          NETWORK_CONFIGURATION: ${{ steps.ecs.outputs.network }}

      - name: Clean up unused task definitions
        if: always()
        env:
          RELEASE_RECEIPT_DIR: ${{ runner.temp }}/peable-release
        run: python3 .github/scripts/ecs-release.py cleanup

      # The scope job's base for the next release: the last commit this workflow
      # actually rolled out, as an Actions cache key (its content is irrelevant).
      # Only a run whose every step above succeeded reaches this, and only on
      # main, so no pull request can move it. Lost or evicted, the next run
      # releases.
      - name: Write the release marker
        run: printf '%s\n' "$RELEASE_SHA" >"$RUNNER_TEMP/release-marker"
      - name: Record this release for the next scope decision
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-marker
          key: peable-release-backend-${{ env.RELEASE_SHA }}

      - name: Retain release receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: peable-release-${{ env.RELEASE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/peable-release
          if-no-files-found: ignore
          retention-days: 14
